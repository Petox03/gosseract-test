name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Dependencias CGO de gosseract (tesseract + leptonica)
      - run: sudo apt-get update && sudo apt-get install -y libtesseract-dev libleptonica-dev pkg-config

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)

      - run: go vet ./...

      - run: go build ./...
